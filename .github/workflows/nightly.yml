name: nightly
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC
  workflow_dispatch:
permissions:
  contents: write # align --apply commits and the public-safe files are pushed; align --assist pushes branches
  pull-requests: write # align --assist opens draft PRs; merged ones are listed with gh
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: parity
    steps:
      # Siblings under the workspace: the raw data never sits inside this repo's working tree (decision 0001 C3).
      # persist-credentials: false: no token is written to either .git/config, where the gate's score-twin child (code an
      # LLM may have written) could read it. The nightly step gets the push credentials in its environment only.
      - uses: actions/checkout@v4
        with:
          path: parity
          persist-credentials: false
          fetch-depth: 0 # the nightly relands a pending branch only when it finds the align commit it cites (src/nightly.ts reland())
      - uses: actions/checkout@v4
        with:
          repository: GSXRcoder159/parity-data
          token: ${{ secrets.PARITY_DATA_TOKEN }}
          path: parity-data
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parity/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Bot identity for commits in both repos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: paritybench nightly
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: without it the assisted pass is skipped and logged
          PARITY_DATA_DIR: ${{ github.workspace }}/parity-data
          GH_TOKEN: ${{ github.token }}
          PARITY_TOKEN: ${{ github.token }}
          PARITY_DATA_TOKEN: ${{ secrets.PARITY_DATA_TOKEN }}
          PARITY_LLM_CAP_USD: ${{ vars.PARITY_LLM_CAP_USD || '3' }} # daily LLM cap (USD); the code keeps its $15 hard ceiling
        # Commits both repos and pushes them itself, this one first, the data repo last; an align commit lands with its
        # sealed-log entries at once, through the data repo's branch nightly/pending-<runId> (src/nightly.ts land()). Git reads each repo's credential from URL-scoped config in the environment (GIT_CONFIG_*), never from disk;
        # the gate's child process gets none of these variables (src/align/gate.ts).
        run: |
          auth() { printf 'AUTHORIZATION: basic %s' "$(printf 'x-access-token:%s' "$1" | base64 -w0)"; }
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/${GITHUB_REPOSITORY}.extraheader"
          export GIT_CONFIG_VALUE_0="$(auth "$PARITY_TOKEN")"
          export GIT_CONFIG_KEY_1="http.https://github.com/GSXRcoder159/parity-data.extraheader"
          export GIT_CONFIG_VALUE_1="$(auth "$PARITY_DATA_TOKEN")"
          unset PARITY_TOKEN PARITY_DATA_TOKEN
          node src/cli.ts nightly
