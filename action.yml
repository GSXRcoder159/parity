name: Parity twin
description: Start the Parity Billing twin (a stateful Stripe-compatible test server) on localhost and export PARITY_TWIN_URL.
inputs:
  port:
    description: Port the twin listens on (127.0.0.1).
    default: "12111"
runs:
  using: composite
  steps:
    # The twin is TypeScript run directly by Node (type stripping, import.meta.main): Node >= 22.18, no npm install.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Start the twin
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        log="$RUNNER_TEMP/parity-twin.log"
        nohup node "$GITHUB_ACTION_PATH/src/twin/main.ts" --port "$PORT" > "$log" 2>&1 &
        # /_parity/state answers 200 without an API key once the twin listens.
        for _ in $(seq 1 50); do
          if curl -fs -o /dev/null "http://127.0.0.1:$PORT/_parity/state"; then
            echo "PARITY_TWIN_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
            cat "$log"
            exit 0
          fi
          sleep 0.2
        done
        echo "::error::the Parity twin did not answer on port $PORT within 10 s"
        cat "$log"
        exit 1
